<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f2ea">
<meta name="description" content="A panel editor, tracing desk and solver for The Witness.">
<title>witness / panel lab</title>
<link rel="icon" href="./mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><img src="./mark.svg" alt="" width="37" height="37"><span>witness<span class="period">.</span><small>panel lab</small></span></div>
    <nav id="mode" class="mode" aria-label="Workspace"></nav>
    <div id="files" class="files" aria-label="Panel files"></div>
  </header>
  <main>
    <section class="work" aria-label="Puzzle workspace">
      <div class="board-module">
        <div class="board-head">
          <div class="board-id"><span class="lamp"></span><span id="board-title">swamp study</span></div>
          <div class="dimensions" id="dimensions"></div>
        </div>
        <div class="instrument">
          <div class="screw tl" aria-hidden="true"></div><div class="screw tr" aria-hidden="true"></div>
          <div class="screw bl" aria-hidden="true"></div><div class="screw br" aria-hidden="true"></div>
          <svg id="board" class="board" tabindex="0" role="application" aria-label="Puzzle grid"></svg>
        </div>
        <div class="board-foot">
          <div id="actions" class="actions"></div>
          <output id="status" class="status" aria-live="polite"></output>
        </div>
      </div>
      <aside id="desk" class="desk" aria-label="Puzzle tools"></aside>
    </section>
    <section class="presets" aria-label="Example panels">
      <h2>library</h2>
      <div id="presets" class="preset-list"></div>
    </section>
  </main>
</div>
<input type="file" id="load-json" accept=".json,application/json" hidden>
<input type="file" id="load-image" accept="image/png,image/jpeg,image/webp,image/avif,image/gif,image/bmp,image/heic,image/heif" hidden>
<script type="module" src="./app.mjs"></script>
</body>
</html>
